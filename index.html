<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Comunas – Región Metropolitana</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="vendor/leaflet.css" />

  <!-- Local styles -->
  <link rel="stylesheet" href="style.css" />
